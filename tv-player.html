<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Flamengo TV — TV Player</title>
<style>html,body,#player{width:100%;height:100%;margin:0;padding:0;background:#000;overflow:hidden}</style>
</head><body><div id="player"></div>
<script>
(function(){
'use strict';
var player=null,pending=null,ORIGIN=window.location.origin;
function send(type,extra){var d={type:type},k;if(extra){for(k in extra){if(Object.prototype.hasOwnProperty.call(extra,k))d[k]=extra[k];}}try{if(window.parent&&window.parent!==window)window.parent.postMessage(d,'*');}catch(e){}}
function param(n){var r=new RegExp('[?&]'+n+'=([^&]+)').exec(window.location.search),v;if(!r)return null;try{v=decodeURIComponent(r[1]);}catch(e){return null;}return v;}
function source(){var v=param('v'),list=param('list');if(v&&/^[A-Za-z0-9_-]{11}$/.test(v))return{kind:'video',value:v};if(list&&/^[A-Za-z0-9_-]{10,80}$/.test(list))return{kind:'playlist',value:list};return null;}
function make(src){var vars={autoplay:1,controls:1,rel:0,playsinline:1,enablejsapi:1,origin:ORIGIN,fs:0,hl:'pt-BR'};var opts={width:'100%',height:'100%',playerVars:vars,events:{onReady:function(e){send('FLATV_READY');try{e.target.playVideo();}catch(x){}},onStateChange:function(e){send('FLATV_STATE',{state:e.data});},onError:function(e){send('FLATV_ERROR',{code:e.data});}}};if(src.kind==='video')opts.videoId=src.value;else{vars.listType='playlist';vars.list=src.value;}player=new YT.Player('player',opts);}
function cmd(d){if(!d||typeof d!=='object'||!player)return;try{
if(d.type==='FLATV_PLAY')player.playVideo();
else if(d.type==='FLATV_PAUSE')player.pauseVideo();
else if(d.type==='FLATV_STOP')player.stopVideo();
else if(d.type==='FLATV_RESTART')player.seekTo(0,true);
else if(d.type==='FLATV_SEEK'){player.seekTo(Math.max(0,player.getCurrentTime()+(Number(d.seconds)||0)),true);}
else if(d.type==='FLATV_GET_TIME'){send('FLATV_TIME',{time:Math.max(0,Number(player.getCurrentTime())||0)});}
else if(d.type==='FLATV_SET_TIME'){player.seekTo(Math.max(0,Number(d.seconds)||0),true);}
else if(d.type==='FLATV_CC_OFF'){try{player.unloadModule('captions');}catch(x){}try{player.unloadModule('cc');}catch(y){}}
}catch(x){}}
window.onYouTubeIframeAPIReady=function(){if(pending){var s=pending;pending=null;make(s);}};
window.addEventListener('message',function(e){cmd(e.data);},false);
var src=source();if(!src){send('FLATV_ERROR',{code:'INVALID_SOURCE'});return;}pending=src;
var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.async=true;s.onerror=function(){send('FLATV_ERROR',{code:'API_LOAD'});};document.head.appendChild(s);
}());
</script></body></html>

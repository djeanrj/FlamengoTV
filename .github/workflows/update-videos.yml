name: Atualizar programação Flamengo TV

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar videos.json
        shell: python
        run: |
          import urllib.request, xml.etree.ElementTree as ET, json, re
          from datetime import datetime, timezone
          channel="UCOa-WaNwQaoyFHLCDk7qKIw"
          url="https://www.youtube.com/feeds/videos.xml?channel_id="+channel
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          data=urllib.request.urlopen(req,timeout=30).read()
          root=ET.fromstring(data)
          ns={"a":"http://www.w3.org/2005/Atom","yt":"http://www.youtube.com/xml/schemas/2015","media":"http://search.yahoo.com/mrss/"}
          videos=[]
          for e in root.findall("a:entry",ns):
              vid=(e.findtext("yt:videoId",default="",namespaces=ns) or "").strip()
              title=(e.findtext("a:title",default="Flamengo TV",namespaces=ns) or "Flamengo TV").strip()
              pub=(e.findtext("a:published",default="",namespaces=ns) or "").strip()
              if vid:
                  videos.append({"id":vid,"title":title,"published":pub,"isShort":False})
          if not videos: raise SystemExit("Feed sem vídeos; mantendo catálogo anterior.")
          out={"channel":{"id":channel,"name":"Flamengo TV","uploadsPlaylist":"UUOa-WaNwQaoyFHLCDk7qKIw"},"updatedAt":datetime.now(timezone.utc).isoformat(),"videos":videos}
          open("videos.json","w",encoding="utf-8").write(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
      - name: Publicar se mudou
        run: |
          if git diff --quiet -- videos.json; then exit 0; fi
          git config user.name "flamengotv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add videos.json
          git commit -m "Atualiza programação Flamengo TV"
          git push

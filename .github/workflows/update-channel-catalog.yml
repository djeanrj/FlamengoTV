name: Atualizar catalogo completo Flamengo TV
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -U yt-dlp
      - name: Gerar channel-catalog.json
        shell: python
        run: |
          import json, subprocess, datetime
          tabs={}
          for name in ("videos","shorts","streams","playlists"):
              try:
                  raw=subprocess.check_output(["yt-dlp","--flat-playlist","--dump-single-json","https://www.youtube.com/@flamengo/"+name],text=True,timeout=240)
                  d=json.loads(raw)
                  tabs[name]=[{"id":e.get("id"),"title":e.get("title"),"url":e.get("url"),"live_status":e.get("live_status"),"duration":e.get("duration")} for e in d.get("entries",[]) if e and e.get("id")]
              except Exception:
                  tabs[name]=[]
          if not any(tabs.values()):
              raise SystemExit("YouTube sem dados; preservando catalogo anterior")
          out={"updatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),"channel":"@flamengo","tabs":tabs}
          open("channel-catalog.json","w",encoding="utf-8").write(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
      - name: Publicar
        run: |
          if git diff --quiet -- channel-catalog.json; then exit 0; fi
          git config user.name "flamengotv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add channel-catalog.json
          git commit -m "Atualiza catalogo completo Flamengo TV"
          git push
